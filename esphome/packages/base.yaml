# Everything both clocks share. A device file supplies the substitutions and
# its own api/ota secrets, so a change to the hardware or the boot sequence is
# made once here instead of once per device.
#
# Required substitutions: device_name, friendly_name, timezone
#
# Network details (static address, domain, DNS) are not part of this package:
# add them in the device file under `wifi:` if you need them - ESPHome merges
# the device file over this package.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.2
  project:
    name: ha-wecker.tc001
    version: 0.3.0
  on_boot:
    priority: -100
    then:
      # GPIO15 must have a defined level as early as possible; otherwise the
      # TC001 buzzer can emit a high-pitched whine during startup.
      - output.turn_off: buzzer_output
      - lambda: id(display_runtime_ready) = true;
      - ds1307.read_time:
          id: rtc_time
      - delay: 1s
      - lambda: id(sleep_mode_active).loop();
      # Evaluate once after the RTC has been restored. Regular checks are
      # aligned to second 00 of each minute in packages/time.yaml.
      - script.execute: evaluate_alarms
      - component.update: next_alarm
      - script.execute:
          id: apply_display_brightness
          refresh_display: true

esp32:
  board: esp32dev
  flash_size: 4MB
  cpu_frequency: 160MHz
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

preferences:
  flash_write_interval: 1s

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: HIGH
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3

packages:
  hardware: !include hardware.yaml
  clock: !include time.yaml
  alarms: !include alarms.yaml
  reading: !include reading-timer.yaml
  sleep: !include sleep.yaml
  display: !include display.yaml
  controls: !include controls.yaml
  diagnostics: !include diagnostics.yaml

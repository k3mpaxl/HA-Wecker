# Copy this file to secrets.yaml and replace every value before flashing.
wifi_ssid: "CHANGE_ME"
wifi_password: "CHANGE_ME"

# Shared by both clocks' fallback access points.
fallback_ap_password: "CHANGE_ME_AP_PASSWORD"

# One set per device, so a compromise of one clock does not hand over the
# other. Generate each key with: openssl rand -base64 32
wecker_1_api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
wecker_1_ota_password: "CHANGE_ME_OTA_PASSWORD"

wecker_2_api_encryption_key: "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB="
wecker_2_ota_password: "CHANGE_ME_OTA_PASSWORD"
